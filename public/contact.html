<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us — Mihurma</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="contact">
  <div id="site-header"></div>
  <main class="container" style="padding: 60px 0 90px; max-width: 560px;">
    <p class="eyebrow">Get in touch</p>
    <h1 style="margin:12px 0 24px;font-size:clamp(2rem,4vw,2.8rem);">Contact Us</h1>
    <div class="form-card">
      <div class="field"><label>Your name</label><input placeholder="Jane Doe"></div>
      <div class="field"><label>Email</label><input type="email" placeholder="you@example.com"></div>
      <div class="field"><label>Message</label><textarea rows="4" placeholder="How can we help?"></textarea></div>
      <button class="btn btn-primary btn-block" onclick="toast('Message sent — we\'ll be in touch soon.')">Send Message</button>
    </div>
    <p style="margin-top:26px;color:var(--text-soft);">Or reach us directly at <a href="mailto:hello@mihurma.com" style="color:var(--gold-strong);font-weight:600;">hello@mihurma.com</a></p>
  </main>
  <div id="site-footer"></div>
  <script src="js/api.js"></script>
  <script src="js/includes.js"></script>
  <script src="js/layout.js"></script>
</body>
</html>
