<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — Mihurma</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-shell page-enter">
    <div class="auth-art">
      <img src="https://picsum.photos/seed/mihurma-auth/900/1200" alt="">
      <div class="content">
        <a href="index.html" class="brand">
          <svg class="petal-mark" viewBox="0 0 32 32" fill="none"><g>
            <ellipse cx="16" cy="9" rx="3.6" ry="7" fill="var(--gold)" transform="rotate(0 16 16)"/>
            <ellipse cx="16" cy="9" rx="3.6" ry="7" fill="var(--gold)" transform="rotate(60 16 16)"/>
            <ellipse cx="16" cy="9" rx="3.6" ry="7" fill="var(--gold)" transform="rotate(120 16 16)"/>
            <ellipse cx="16" cy="9" rx="3.6" ry="7" fill="var(--gold)" transform="rotate(180 16 16)"/>
            <ellipse cx="16" cy="9" rx="3.6" ry="7" fill="var(--gold)" transform="rotate(240 16 16)"/>
            <ellipse cx="16" cy="9" rx="3.6" ry="7" fill="var(--gold)" transform="rotate(300 16 16)"/>
            <circle cx="16" cy="16" r="3" fill="var(--brown-strong)"/>
          </g></svg>
          Mihurma
        </a>
      </div>
      <blockquote>"Find more, save more, live better." Welcome back to the marketplace that treats you like royalty.</blockquote>
    </div>
    <div class="auth-form-side">
      <a href="index.html" class="back-home">← Back to store</a>
      <div class="form-card">
        <h2 style="margin-bottom:6px;">Welcome back</h2>
        <p style="color:var(--text-soft);margin-bottom:26px;">Log in to track orders and check out faster.</p>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="you@example.com" autocomplete="email">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" placeholder="••••••••" autocomplete="current-password">
        </div>
        <div id="auth-error" class="field-error" style="display:block;min-height:18px;"></div>
        <button id="login-btn" class="btn btn-primary btn-block">Log In</button>
        <p class="auth-toggle-line">New to Mihurma? <a href="signup.html" style="color:var(--gold-strong);font-weight:600;">Create an account</a></p>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const errorBox = document.getElementById('auth-error');
    const btn = document.getElementById('login-btn');

    async function doLogin() {
      errorBox.textContent = '';
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      if (!email || !password) { errorBox.textContent = 'Please enter your email and password.'; return; }
      btn.disabled = true; btn.textContent = 'Logging in…';
      try {
        await api('/auth/login', { method: 'POST', body: { email, password } });
        window.location.href = params.get('next') || 'dashboard.html';
      } catch (e) {
        errorBox.textContent = e.message;
        btn.disabled = false; btn.textContent = 'Log In';
      }
    }
    btn.addEventListener('click', doLogin);
    document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  </script>
</body>
</html>
