<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product — Mihurma</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .pdp{ padding: 40px 0 90px; display:grid; grid-template-columns: 1fr 1fr; gap: 56px; align-items:start; }
  .gallery-main{ aspect-ratio: 1/1; border-radius: var(--radius); overflow:hidden; background: var(--bg-alt); box-shadow: var(--shadow); }
  .gallery-main img{ width:100%; height:100%; object-fit:cover; transition: opacity .25s ease; }
  .gallery-thumbs{ display:flex; gap: 12px; margin-top: 14px; flex-wrap:wrap; }
  .gallery-thumbs img{ width: 74px; height: 74px; object-fit:cover; border-radius: 10px; cursor:pointer; border: 2px solid transparent; transition: border-color var(--transition), opacity var(--transition); opacity:.7; }
  .gallery-thumbs img:hover{ opacity:1; }
  .gallery-thumbs img.active{ border-color: var(--gold); opacity:1; }
  .pdp-title{ font-size: clamp(1.7rem, 3vw, 2.3rem); margin-bottom:10px; }
  .pdp-stars{ display:flex; align-items:center; gap:10px; margin-bottom: 18px; }
  .pdp-price-row{ display:flex; align-items:baseline; gap:12px; margin-bottom: 22px; }
  .pdp-price{ font-family: var(--font-display); font-size: 2rem; font-weight:600; }
  .pdp-desc{ color: var(--text-soft); line-height:1.7; margin-bottom: 26px; }
  .qty-row{ display:flex; align-items:center; gap: 16px; margin-bottom: 24px; }
  .qty-stepper{ display:flex; align-items:center; border:1px solid var(--border); border-radius: 999px; overflow:hidden; }
  .qty-stepper button{ width:40px; height:40px; border:none; background:var(--surface); color:var(--text); font-size:1.1rem; cursor:pointer; transition: background var(--transition); }
  .qty-stepper button:hover{ background: var(--bg-alt); }
  .qty-stepper span{ width: 46px; text-align:center; font-weight:600; }
  .stock-note{ font-size:.85rem; color: var(--text-soft); }
  .stock-note.low{ color: var(--danger); }
  .pdp-actions{ display:flex; gap: 14px; flex-wrap:wrap; margin-bottom: 26px; }
  .pdp-meta{ display:flex; gap:22px; color:var(--text-soft); font-size:.85rem; border-top:1px solid var(--border); padding-top:18px; }
  @media (max-width: 860px){ .pdp{ grid-template-columns: 1fr; gap: 30px; } }

  .reviews-section{ padding: 20px 0 90px; border-top: 1px solid var(--border); margin-top: 30px; }
  .review-summary{ display:flex; align-items:center; gap: 30px; margin-bottom: 34px; flex-wrap:wrap; }
  .review-big-score{ font-family: var(--font-display); font-size: 3rem; font-weight:700; }
  .review-card{ background:var(--surface); border:1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 14px; }
  .review-card .head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .review-card .name{ font-weight:600; }
  .review-card .date{ font-size:.78rem; color:var(--text-soft); }
  .star-picker{ display:flex; gap:6px; font-size:1.6rem; cursor:pointer; margin-bottom: 14px; }
  .star-picker span{ color: var(--border); transition: color .15s ease; }
  .star-picker span.filled{ color: var(--gold); }
  .related-section{ padding: 0 0 90px; }
</style>
</head>
<body data-page="shop">
  <div id="site-header"></div>

  <main class="container">
    <div id="pdp-root" class="pdp"></div>

    <section class="reviews-section container" style="padding-left:0;padding-right:0;">
      <div class="section-title" style="text-align:left;">
        <h2>Customer Reviews</h2>
      </div>
      <div id="review-summary" class="review-summary"></div>
      <div id="review-form-slot"></div>
      <div id="reviews-list"></div>
    </section>

    <section class="related-section">
      <div class="section-title"><h2>You May Also Like</h2></div>
      <div id="related-grid" class="product-grid"></div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="js/api.js"></script>
  <script src="js/includes.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/product-card.js"></script>
  <script src="js/product.js"></script>
</body>
</html>
